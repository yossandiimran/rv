<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>RAKYAT: LAST STAND</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game" width="960" height="540" aria-label="Arena pertarungan"></canvas>

        <!-- Menu -->
        <section id="menu" class="screen">
          <h1>RAKYAT<small>LAST STAND</small></h1>
          <p class="tag">Game fighting satir · rakyat biasa lawan para penguasa</p>
          <div class="menu-buttons">
            <button id="btn-continue" class="btn hidden">Lanjutkan</button>
            <button id="btn-campaign" class="btn primary">Campaign</button>
            <button id="btn-arcade" class="btn">Arcade</button>
          </div>
          <p class="fine">Fiksi satir. Semua serangan adalah metafora arcade, bukan klaim faktual tentang individu nyata.</p>
        </section>

        <!-- Character select -->
        <section id="select" class="screen hidden">
          <h2>Pilih Petarung</h2>
          <div id="char-grid" class="grid"></div>
          <button class="btn small back" data-back="menu">‹ Kembali</button>
        </section>

        <!-- Arcade opponent select -->
        <section id="opponents" class="screen hidden">
          <h2>Pilih Lawan</h2>
          <div id="boss-grid" class="grid boss"></div>
          <button class="btn small back" data-back="select">‹ Kembali</button>
        </section>

        <!-- Result -->
        <section id="result" class="screen overlay hidden">
          <h2 id="result-title"></h2>
          <p id="result-copy"></p>
          <div class="menu-buttons row">
            <button id="btn-next" class="btn primary"></button>
            <button id="btn-quit" class="btn">Menu</button>
          </div>
        </section>

        <!-- Pause -->
        <section id="pause" class="screen overlay hidden">
          <h2>Dijeda</h2>
          <div class="menu-buttons row">
            <button id="btn-resume" class="btn primary">Lanjut</button>
            <button id="btn-quit2" class="btn">Keluar</button>
          </div>
        </section>

        <div id="loading" class="screen overlay hidden"><p>Memuat petarung…</p></div>

        <!-- Touch controls (shown on touch devices during a fight) -->
        <div id="touch" class="hidden">
          <div id="joystick" class="joystick" role="application" aria-label="Analog gerak">
            <span class="ring"></span><span id="joystick-knob" class="knob"></span>
          </div>
          <div class="pad">
            <button class="tb punch" data-action="punch">Pukul</button>
            <button class="tb kick" data-action="kick">Tendang</button>
            <button class="tb special" data-action="special">Spesial</button>
            <button class="tb block" data-action="block">Tahan</button>
            <button class="tb dodge" data-action="dodge">Hindar</button>
          </div>
          <button id="btn-pause" class="tb pause" aria-label="Jeda">II</button>
        </div>
      </div>

      <div id="rotate" class="hidden">
        <p>Putar HP ke mode landscape untuk bermain</p>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>

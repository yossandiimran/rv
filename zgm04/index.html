<script>
"use strict";
const T=32,VW=800,VH=448,ROWS=14;
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
if("ontouchstart" in window||navigator.maxTouchPoints>0)document.body.classList.add("touch");
function fit(){const s=Math.min(innerWidth/VW,innerHeight/VH);cv.style.width=VW*s+"px";cv.style.height=VH*s+"px"}
addEventListener("resize",fit);fit();
// ===== simpan =====
let SV={best:0,unlocked:1};try{const s=JSON.parse(localStorage.getItem("raka_save")||"null");if(s)SV=Object.assign(SV,s)}catch(e){}
function persist(){try{localStorage.setItem("raka_save",JSON.stringify(SV))}catch(e){}}
// ===== audio =====
let ac=null;function snd(k){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 const c={jump:["square",300,650,.16,.06],coin:["square",900,1500,.12,.06],stomp:["square",250,80,.12,.08],bump:["triangle",150,90,.08,.1],power:["square",400,1200,.35,.07],hurt:["sawtooth",400,70,.4,.08],die:["sawtooth",500,60,.9,.09],win:["square",500,1500,.8,.07],brk:["sawtooth",200,50,.15,.08]}[k];
 o.type=c[0];o.frequency.setValueAtTime(c[1],t);o.frequency.exponentialRampToValueAtTime(c[2],t+c[3]);g.gain.setValueAtTime(c[4],t);g.gain.exponentialRampToValueAtTime(.001,t+c[3]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+c[3]+.02)}catch(e){}}
// ===== level =====
const THEMES=[
 {sky:["#5c94fc","#a8d4ff"],hill:"#4aa84a",gnd:"#c8782c",top:"#3cb43c",name:"Padang Fajar"},
 {sky:["#1c1630","#3a2a5a"],hill:"#2a2040",gnd:"#6a5a74",top:"#8a7aa0",name:"Gua Kristal",cave:1},
 {sky:["#0c1430","#3a2060"],hill:"#1a1840",gnd:"#5a3a3a",top:"#8a4a4a",name:"Benteng Gelap",night:1}
];
function build(n){const W={0:150,1:170,2:190}[n];const g=Array.from({length:ROWS},()=>Array(W).fill(" "));const en=[],coins=[];
 for(let x=0;x<W;x++){g[12][x]="#";g[13][x]="#"}
 const set=(x,y,c)=>{if(x>=0&&x<W&&y>=0&&y<ROWS)g[y][x]=c};
 const gap=(x,w)=>{for(let i=0;i<w;i++){set(x+i,12," ");set(x+i,13," ")}};
 const S=(x,y,s)=>{for(let i=0;i<s.length;i++)if(s[i]!==" ")set(x+i,y,s[i])};
 const C=(x,y,k)=>{for(let i=0;i<k;i++)coins.push({x:(x+i)*T+8,y:y*T+8,got:0})};
 const E=(x,t,y)=>en.push({x:x*T,y:(y===undefined?11:y)*T-(t==="b"?0:0),t,vx:t==="s"?-30:t==="b"?-50:-45,vy:0,w:t==="s"?28:28,h:t==="s"?28:26,dead:0,sq:0,ph:Math.random()*6,by:(y===undefined?9:y)*T});
 const stairs=(x,k)=>{for(let i=0;i<k;i++)for(let j=0;j<=i;j++)set(x+i,11-j,"=")};
 const flagX=W-14;
 if(n===0){gap(30,2);gap(56,3);gap(84,2);gap(100,3);gap(118,2);
  S(14,8,"B?B");S(18,8,"P");S(16,4,"?");S(40,8,"BBBBB");S(41,5,"?B?");S(64,8,"?B?B?");S(75,8,"B?B");S(90,8,"BB?BB");S(104,7,"===");S(108,6,"===");
  C(14,7,3);C(30,9,2);C(56,8,3);C(84,9,2);C(100,8,3);C(41,4,3);C(104,6,3);C(108,5,3);C(122,10,4);
  [20,36,45,62,70,78,95,110,113].forEach(x=>E(x,"w"));stairs(126,5)}
 if(n===1){gap(20,2);gap(36,3);gap(52,2);gap(66,4);gap(86,3);gap(104,2);gap(120,4);gap(140,3);
  S(12,8,"B?B?B");S(16,5,"P");S(30,8,"===");S(42,8,"?");S(44,6,"===");S(58,8,"B?B");S(70,8,"===");S(74,6,"===");S(78,8,"===");S(92,8,"BB?BB");S(106,7,"===");S(122,8,"===");S(127,6,"===");S(132,8,"===");S(146,8,"B?B?B");
  C(12,7,5);C(30,7,3);C(44,5,3);C(70,7,3);C(74,5,3);C(78,7,3);C(122,7,3);C(127,5,3);C(132,7,3);C(146,7,5);
  [16,26,34,48,60,62,82,96,98,112,114,135,150,152].forEach((x,i)=>E(x,i%3==1?"s":"w"));[40,72,100,128].forEach(x=>E(x,"b",8));stairs(154,5)}
 if(n===2){gap(18,3);gap(32,3);gap(46,4);gap(62,3);gap(76,4);gap(94,3);gap(108,4);gap(124,3);gap(138,5);gap(156,3);
  S(10,8,"B?B");S(14,5,"P");S(26,8,"===");S(34,8,"===");S(48,8,"===");S(53,6,"===");S(64,8,"?B?");S(78,8,"===");S(82,6,"===");S(86,8,"===");S(96,8,"B?B");S(110,8,"===");S(114,6,"===");S(140,8,"===");S(144,6,"===");S(148,8,"===");S(162,8,"B?B?B");
  C(10,7,3);C(26,7,3);C(48,7,3);C(53,5,3);C(78,7,3);C(82,5,3);C(86,7,3);C(110,7,3);C(114,5,3);C(140,7,3);C(144,5,3);C(148,7,3);C(162,7,5);
  [14,24,29,40,42,56,58,70,72,90,92,100,102,118,120,130,132,152,154,164].forEach((x,i)=>E(x,i%2?"s":"w"));[30,60,84,112,142,150].forEach(x=>E(x,"b",8));stairs(168,5)}
 return {g,W,en,coins,flagX:W-8,theme:THEMES[n],name:"DUNIA 1-"+(n+1)+"  "+THEMES[n].name}}
// ===== state =====
let st="title",lvl=0,L=null,P=null,cam=0,score=0,coinN=0,lives=3,tm=300,stT=0,parts=[],items=[],keys={},touch={l:0,r:0,j:0,s:0},jumpHeld=false,anim=0,flagSlide=0;
function newPlayer(){return {x:3*T,y:10*T,w:22,h:30,vx:0,vy:0,on:0,face:1,big:0,inv:0,ph:0,dead:0,jcool:0}}
function loadLevel(n){lvl=n;L=build(n);P=newPlayer();cam=0;tm=300;parts=[];items=[];flagSlide=0;stT=0;st="intro";document.body.classList.remove("playing")}
function startGame(){score=0;coinN=0;lives=3;loadLevel(0)}
const solidCh="#B?PU=";
function solid(tx,ty){if(tx<0)return true;if(tx>=L.W||ty<0||ty>=ROWS)return false;return solidCh.indexOf(L.g[ty][tx])>=0}
function moveBody(e,dt,isP){let hitHead=null;
 e.x+=e.vx*dt;e.wall=0;let x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-.01)/T),y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-.01)/T);
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){if(e.vx>0)e.x=tx*T-e.w;else if(e.vx<0)e.x=(tx+1)*T;e.wall=1;e.vx=isP?0:e.vx;x0=Math.floor(e.x/T);x1=Math.floor((e.x+e.w-.01)/T)}
 e.vy=Math.min(e.vy+1900*dt,880);e.y+=e.vy*dt;e.on=0;y0=Math.floor(e.y/T);y1=Math.floor((e.y+e.h-.01)/T);x0=Math.floor(e.x/T);x1=Math.floor((e.x+e.w-.01)/T);
 let best=null,bd=1e9;
 for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)){if(e.vy>0){e.y=ty*T-e.h;e.vy=0;e.on=1}else if(e.vy<0){e.y=(ty+1)*T;e.vy=0;const d=Math.abs(tx*T+T/2-(e.x+e.w/2));if(d<bd){bd=d;best=[tx,ty]}}}
 if(best&&isP)hitBlock(best[0],best[1])}
function hitBlock(tx,ty){const c=L.g[ty][tx];
 if(c==="?"){L.g[ty][tx]="U";coinN++;score+=100;snd("coin");parts.push({k:"coin",x:tx*T+8,y:ty*T-8,vy:-380,t:0});bumpFx(tx,ty)}
 else if(c==="P"){L.g[ty][tx]="U";snd("bump");items.push({x:tx*T+4,y:ty*T-24,w:24,h:24,vx:70,vy:-260,t:"p"});bumpFx(tx,ty)}
 else if(c==="B"){if(P.big){L.g[ty][tx]=" ";snd("brk");score+=50;for(let i=0;i<6;i++)parts.push({k:"deb",x:tx*T+16,y:ty*T+16,vx:(i%3-1)*120+Math.random()*40,vy:-300-Math.random()*200,t:0})}else{snd("bump");bumpFx(tx,ty)}}
 // musuh di atas blok mati
 for(const e of L.en)if(!e.dead&&Math.abs(e.x+e.w/2-(tx*T+16))<24&&Math.abs(e.y+e.h-ty*T)<6){e.dead=2;e.vy=-300;score+=100}}
function bumpFx(tx,ty){parts.push({k:"bump",x:tx*T,y:ty*T,t:0})}
function hurt(){if(P.inv>0||P.dead)return;if(P.big){P.big=0;P.h=30;P.y+=16;P.inv=1.6;snd("hurt")}else die()}
function die(){if(P.dead)return;P.dead=1;P.vy=-620;P.vx=0;st="dying";stT=0;snd("die");document.body.classList.remove("playing")}
// ===== update =====
function update(dt){anim+=dt;
 if(st==="title"||st==="over"||st==="end"){return}
 if(st==="intro"){stT+=dt;if(stT>2.2){st="play";document.body.classList.add("playing")}return}
 if(st==="dying"){stT+=dt;P.vy+=1900*dt;P.y+=P.vy*dt;if(stT>2.2){lives--;if(lives<=0){st="over";if(score>SV.best){SV.best=score;persist()}}else loadLevel(lvl)}return}
 if(st==="clear"){stT+=dt;if(flagSlide<1)flagSlide+=dt*1.2;P.vx=0;P.x+=0;if(stT>.9&&stT<2.6){P.x+=70*dt;P.face=1;P.ph+=dt*10}
  if(stT>3.2){const bonus=Math.floor(tm)*5;score+=bonus;if(lvl>=2){st="end";SV.unlocked=3;if(score>SV.best)SV.best=score;persist()}else{SV.unlocked=Math.max(SV.unlocked,lvl+2);persist();loadLevel(lvl+1)}}return}
 // play
 tm-=dt;if(tm<=0){tm=0;die();return}
 const l=keys.ArrowLeft||keys.a||touch.l,r=keys.ArrowRight||keys.d||touch.r,run=keys.Shift||keys.x||touch.s,jmp=keys[" "]||keys.ArrowUp||keys.w||keys.z||touch.j;
 const maxV=run?290:190,acc=(P.on?1400:900);
 if(l&&!r){P.vx-=acc*dt;P.face=-1}else if(r&&!l){P.vx+=acc*dt;P.face=1}else{const f=(P.on?1300:200)*dt;if(P.vx>0)P.vx=Math.max(0,P.vx-f);else P.vx=Math.min(0,P.vx+f)}
 P.vx=Math.max(-maxV,Math.min(maxV,P.vx));
 if(jmp&&!jumpHeld&&P.on){P.vy=-690-Math.abs(P.vx)*.12;P.on=0;snd("jump")}
 if(!jmp&&P.vy<-250)P.vy=-250;jumpHeld=!!jmp;
 moveBody(P,dt,true);if(P.x<cam)P.x=cam;P.ph+=Math.abs(P.vx)*dt*.06;if(P.inv>0)P.inv-=dt;
 if(P.y>ROWS*T+60){die();return}
 cam=Math.max(0,Math.min(L.W*T-VW,P.x-VW*.4));
 // musuh
 for(const e of L.en){if(e.dead===1){e.sq+=dt;continue}if(e.dead===2){e.vy+=1900*dt;e.y+=e.vy*dt;continue}
  if(Math.abs(e.x-P.x)>VW)continue;
  if(e.t==="b"){e.x+=e.vx*dt;e.y=e.by+Math.sin(anim*3+e.ph)*34;if(solid(Math.floor((e.x+(e.vx<0?0:e.w))/T),Math.floor((e.y+14)/T)))e.vx=-e.vx}
  else{e.on=0;moveBody(e,dt,false);if(e.wall)e.vx=-e.vx;else if(e.on){const ax=Math.floor((e.x+(e.vx>0?e.w+4:-4))/T),ay=Math.floor((e.y+e.h+4)/T);if(!solid(ax,ay)&&e.t==="s")e.vx=-e.vx}if(e.y>ROWS*T+80)e.dead=3}
  // tabrakan dengan pemain
  if(!P.dead&&P.x<e.x+e.w&&P.x+P.w>e.x&&P.y<e.y+e.h&&P.y+P.h>e.y){
   if(e.t!=="s"&&P.vy>-150&&P.y+P.h-e.y<22){e.dead=1;e.sq=0;P.vy=jmp?-620:-380;score+=200;snd("stomp")}else hurt()}}
 L.en=L.en.filter(e=>!(e.dead===3||(e.dead===1&&e.sq>.4)||(e.dead===2&&e.y>ROWS*T+100)));
 // item
 for(const it of items){it.vy+=1900*dt;const b={x:it.x,y:it.y,w:it.w,h:it.h,vx:it.vx,vy:it.vy};moveBody(b,dt,false);if(b.wall)b.vx=-b.vx;it.x=b.x;it.y=b.y;it.vx=b.vx;it.vy=b.vy;
  if(P.x<it.x+it.w&&P.x+P.w>it.x&&P.y<it.y+it.h&&P.y+P.h>it.y){it.got=1;snd("power");score+=1000;if(!P.big){P.big=1;P.y-=16;P.h=46}}if(it.y>ROWS*T+50)it.got=1}
 items=items.filter(i=>!i.got);
 // koin
 for(const c of L.coins)if(!c.got&&P.x<c.x+16&&P.x+P.w>c.x&&P.y<c.y+16&&P.y+P.h>c.y){c.got=1;coinN++;score+=100;snd("coin");if(coinN%50===0){lives++;snd("power")}}
 // bendera
 if(P.x+P.w>L.flagX*T+14&&!P.dead){st="clear";stT=0;flagSlide=0;snd("win");document.body.classList.remove("playing");P.x=L.flagX*T-10}
 for(const p of parts){p.t+=dt;if(p.k==="coin"){p.vy+=1500*dt;p.y+=p.vy*dt}if(p.k==="deb"){p.vy+=1500*dt;p.y+=p.vy*dt;p.x+=p.vx*dt}}
 parts=parts.filter(p=>p.t<(p.k==="bump"?.15:.8))}
// ===== gambar =====
function px(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawBg(){const th=L?L.theme:THEMES[0];const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
 if(th.night||th.cave){ctx.fillStyle="#fff";for(let i=0;i<40;i++){const x=(i*173+((-cam*.05)%VW+VW))%VW,y=(i*91)%250;ctx.globalAlpha=.4+.5*Math.sin(anim*2+i);ctx.fillRect(x,y,2,2)}ctx.globalAlpha=1;
  if(th.night){ctx.fillStyle="#f4eecf";ctx.beginPath();ctx.arc(650,70,28,0,7);ctx.fill()}}
 else{ctx.fillStyle="rgba(255,255,255,.9)";for(let i=0;i<8;i++){const x=((i*260-cam*.3)%(VW+260)+VW+260)%(VW+260)-130,y=40+(i*53)%90;ctx.beginPath();ctx.arc(x,y,20,0,7);ctx.arc(x+22,y+4,16,0,7);ctx.arc(x-22,y+6,15,0,7);ctx.fill()}}
 ctx.fillStyle=th.hill;for(let i=-1;i<7;i++){const x=i*300-((cam*.5)%300);ctx.beginPath();ctx.moveTo(x,12*T);ctx.quadraticCurveTo(x+150,12*T-150,x+300,12*T);ctx.fill()}
 if(th.cave){ctx.fillStyle="#6a5aa0";for(let i=0;i<10;i++){const x=((i*140-cam*.7)%1400+1400)%1400-100;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+22,0);ctx.lineTo(x+11,40+(i*37)%60);ctx.fill()}}}
function drawTiles(){const th=L.theme;const c0=Math.floor(cam/T),c1=c0+Math.ceil(VW/T)+1;
 for(let ty=0;ty<ROWS;ty++)for(let tx=c0;tx<=c1&&tx<L.W;tx++){const c=L.g[ty][tx];if(c===" ")continue;let x=tx*T-cam,y=ty*T;
  for(const p of parts)if(p.k==="bump"&&Math.floor(p.x/T)===tx&&Math.floor(p.y/T)===ty)y-=Math.sin(p.t/.15*Math.PI)*8;
  if(c==="#"){const top=ty===12||L.g[ty-1][tx]!=="#";px(th.gnd,x,y,T,T);if(top){px(th.top,x,y,T,8);px("rgba(0,0,0,.18)",x,y+8,T,2)}px("rgba(0,0,0,.14)",x+4,y+16,8,4);px("rgba(0,0,0,.14)",x+20,y+24,8,4)}
  else if(c==="B"){px("#b8542c",x,y,T,T);px("#7a3418",x,y+10,T,2);px("#7a3418",x,y+21,T,2);px("#7a3418",x+15,y,2,10);px("#7a3418",x+7,y+11,2,10);px("#7a3418",x+23,y+11,2,10);px("#7a3418",x+15,y+22,2,10);px("#e07a4c",x,y,T,2)}
  else if(c==="?"||c==="P"){const f=.7+.3*Math.sin(anim*6);px("#e8a820",x,y,T,T);px("#ffd84a",x+2,y+2,T-4,T-4);px("#a86a10",x,y,T,2);px("#a86a10",x,y+T-2,T,2);ctx.fillStyle="#7a4a08";ctx.font="bold 22px system-ui";ctx.textAlign="center";ctx.globalAlpha=f;ctx.fillText(c==="P"?"★":"?",x+16,y+24);ctx.globalAlpha=1}
  else if(c==="U"){px("#6a4a30",x,y,T,T);px("#4a3220",x+3,y+3,T-6,T-6);px("#7a5a3c",x+5,y+5,T-10,T-10)}
  else if(c==="="){px("#8a8aa0",x,y,T,T);px("#b0b0c8",x,y,T,3);px("#5a5a70",x,y+T-3,T,3);px("#5a5a70",x+T-3,y,3,T);px("#70708a",x+8,y+9,16,14)}}}
function drawCoin(c){const w=Math.abs(Math.cos(anim*5+c.x*.05))*12+2;const x=c.x-cam+8,y=c.y+8;ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.ellipse(x,y,w/2+1,9,0,0,7);ctx.fill();ctx.fillStyle="#c89010";ctx.beginPath();ctx.ellipse(x,y,w/4,5,0,0,7);ctx.fill()}
function drawEnemy(e){const x=e.x-cam,y=e.y;if(e.dead===1){px("#7a4a1c",x,y+e.h-8,e.w,8);return}
 if(e.t==="w"){const s=Math.sin(anim*10+e.x)*2;px("#2a1a10",x+2,y+e.h-5,8,5+s>0?5:4);px("#2a1a10",x+e.w-10,y+e.h-5,8,5);ctx.fillStyle="#8a5a2c";ctx.beginPath();ctx.ellipse(x+14,y+14,14,13,0,Math.PI,0);ctx.lineTo(x+28,y+22);ctx.lineTo(x,y+22);ctx.fill();px("#c89060",x+3,y+16,22,7);px("#fff",x+6,y+9,6,7);px("#fff",x+16,y+9,6,7);px("#111",x+8+(e.vx>0?2:0),y+12,3,4);px("#111",x+18+(e.vx>0?2:0),y+12,3,4);px("#5a2a10",x+5,y+7,8,2);px("#5a2a10",x+15,y+7,8,2)}
 else if(e.t==="s"){ctx.save();ctx.translate(x+14,y+14);ctx.rotate(anim*3*(e.vx>0?1:-1));ctx.fillStyle="#e8e8e8";for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(-5,-10);ctx.lineTo(0,-19);ctx.lineTo(5,-10);ctx.fill()}ctx.fillStyle="#c83030";ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();ctx.restore();px("#fff",x+7,y+10,5,6);px("#fff",x+16,y+10,5,6);px("#111",x+9,y+13,3,3);px("#111",x+18,y+13,3,3)}
 else{const f=Math.sin(anim*14)*8;ctx.fillStyle="#6a3aa0";ctx.beginPath();ctx.ellipse(x+14,y+14,8,10,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x+14,y+8);ctx.lineTo(x-6,y+4+f);ctx.lineTo(x+2,y+18);ctx.fill();ctx.beginPath();ctx.moveTo(x+14,y+8);ctx.lineTo(x+34,y+4+f);ctx.lineTo(x+26,y+18);ctx.fill();px("#ff4a4a",x+9,y+10,3,3);px("#ff4a4a",x+16,y+10,3,3)}}
function drawPlayer(){if(P.inv>0&&Math.floor(anim*20)%2)return;const x=P.x-cam,y=P.y,f=P.face,big=P.big,h=P.h;ctx.save();ctx.translate(Math.round(x+P.w/2),0);ctx.scale(f,1);const X=-P.w/2;
 const air=!P.on,step=air?2:Math.floor(P.ph)%2;
 px("#4a2a10",X+(step?1:5),y+h-8,9,8);px("#4a2a10",X+(step?12:8),y+h-8,9,8);
 px("#2a58c8",X+2,y+h-(big?24:16),18,big?16:10);px("#2a58c8",X+4,y+(big?14:10),14,big?10:6);
 px("#f0d8b0",X-1,y+(big?18:13),4,7);px("#f0d8b0",X+19,y+(big?18:13),4,7);
 px("#e8b848",X+9,y+(big?15:11),4,4);
 px("#f0c898",X+3,y+(big?2:-1)+3,16,12);px("#111",X+13,y+(big?8:5)+3,3,4);px("#7a4a20",X+7,y+(big?13:10)+3,10,2);
 px("#1a9a4a",X+1,y+(big?-1:-3)+3,20,6);px("#1a9a4a",X+11,y+(big?3:1)+3,12,4);px("#fff",X+6,y+(big?0:-2)+3,4,3);ctx.restore()}
function drawFlag(){const x=L.flagX*T-cam,gy=12*T;px("#ddd",x+14,gy-250,4,250);ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.arc(x+16,gy-254,6,0,7);ctx.fill();const fy=gy-240+Math.min(1,flagSlide)*190;ctx.fillStyle="#e83a3a";ctx.beginPath();ctx.moveTo(x+18,fy);ctx.lineTo(x+56,fy+14);ctx.lineTo(x+18,fy+28);ctx.fill();
 px("#6a6a80",x+60,gy-96,100,96);px("#4a4a60",x+60,gy-96,100,8);for(let i=0;i<4;i++)px("#4a4a60",x+60+i*26,gy-110,16,14);px("#111",x+96,gy-48,28,48)}
function hud(){ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,VW,30);ctx.fillStyle="#fff";ctx.font="bold 16px system-ui";ctx.textAlign="left";ctx.fillText("SKOR "+String(score).padStart(6,"0"),12,21);ctx.fillText("🪙 ×"+coinN,190,21);ctx.fillText("❤ ×"+lives,290,21);ctx.textAlign="center";ctx.fillText(L.name,500,21);ctx.textAlign="right";ctx.fillText("⏱ "+Math.ceil(tm),VW-12,21)}
function center(t,y,size,col){ctx.textAlign="center";ctx.font="bold "+size+"px system-ui";ctx.fillStyle="#000";ctx.fillText(t,VW/2+2,y+2);ctx.fillStyle=col||"#fff";ctx.fillText(t,VW/2,y)}
function draw(){
 if(st==="title"||st==="over"||st==="end"){const th=THEMES[st==="end"?0:0];const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,"#5c94fc");g.addColorStop(1,"#a8d4ff");ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);ctx.fillStyle="#4aa84a";ctx.beginPath();ctx.moveTo(0,VH);ctx.quadraticCurveTo(200,260,420,VH);ctx.fill();ctx.beginPath();ctx.moveTo(300,VH);ctx.quadraticCurveTo(560,220,860,VH);ctx.fill();px("#c8782c",0,VH-64,VW,64);px("#3cb43c",0,VH-64,VW,10);
  const bob=Math.sin(anim*3)*4;
  if(st==="title"){center("PETUALANGAN RAKA",120+bob,54,"#ffe45a");ctx.font="17px system-ui";center("Kristal Fajar dicuri Raja Kegelapan.",170,18);center("Bantu Raka melewati 3 dunia untuk merebutnya kembali!",196,18);
   center("▶ KETUK / TEKAN ENTER UNTUK MULAI",280,24,anim%1<.6?"#fff":"#ffe45a");center("Rekor: "+SV.best,320,18);ctx.font="14px system-ui";center("Panah/WASD = gerak • Spasi = lompat • Shift = lari",350,15,"#222")}
  if(st==="over"){center("GAME OVER",150,60,"#ff5a5a");center("Skor: "+score+"   Rekor: "+SV.best,210,24);center("Ketuk untuk main lagi",290,22,anim%1<.6?"#fff":"#ffe45a")}
  if(st==="end"){center("SELAMAT!",110,60,"#ffe45a");center("Raka merebut kembali Kristal Fajar",170,24);center("dan kedamaian kembali ke negeri itu. TAMAT",202,22);center("Skor akhir: "+score,260,26);center("Ketuk untuk kembali ke menu",320,20,anim%1<.6?"#fff":"#ffe45a")}
  return}
 drawBg();drawTiles();drawFlag();for(const c of L.coins)if(!c.got&&c.x-cam>-20&&c.x-cam<VW+20)drawCoin(c);
 for(const e of L.en)if(e.x-cam>-60&&e.x-cam<VW+60)drawEnemy(e);
 for(const it of items){const x=it.x-cam,y=it.y;ctx.fillStyle="#ffd84a";ctx.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,r=i%2?6:13;ctx.lineTo(x+12+Math.cos(a)*r,y+13+Math.sin(a)*r)}ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(x+9,y+9,3,3)}
 for(const p of parts){if(p.k==="coin"){ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.ellipse(p.x-cam+8,p.y,5,9,0,0,7);ctx.fill()}if(p.k==="deb"){px("#b8542c",p.x-cam,p.y,8,8)}}
 drawPlayer();hud();
 if(st==="intro"){ctx.fillStyle="rgba(0,0,0,.82)";ctx.fillRect(0,0,VW,VH);center(L.name,190,40,"#ffe45a");center("❤ ×"+lives,250,28)}
 if(st==="clear"){center("DUNIA SELESAI!",160,48,"#ffe45a");center("Bonus waktu: "+Math.floor(tm)*5,205,24)}
 if(st==="dying"&&stT>1.2){}}
// ===== input =====
addEventListener("keydown",e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=1;if(e.key===" "||e.key.startsWith("Arrow"))e.preventDefault();if(e.key==="Enter"||e.key===" ")tap()});
addEventListener("keyup",e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=0});
function tap(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
 if(st==="title"){startGame()}else if(st==="over"){st="title"}else if(st==="end"){st="title"}}
cv.addEventListener("pointerdown",tap);
function bind(id,k){const b=document.getElementById(id);const on=e=>{e.preventDefault();touch[k]=1;b.classList.add("on");try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}},off=e=>{e.preventDefault();touch[k]=0;b.classList.remove("on")};b.addEventListener("pointerdown",on);b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off);b.addEventListener("contextmenu",e=>e.preventDefault())}
bind("bl","l");bind("br","r");bind("bj","j");bind("bs","s");
document.addEventListener("visibilitychange",()=>{if(document.hidden){touch.l=touch.r=touch.j=touch.s=0;keys={}}});
// ===== loop =====
let last=0;function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw()}
window.__t={startGame,update,draw,get st(){return st},get P(){return P},get L(){return L},touch,loadLevel,keys};
requestAnimationFrame(loop);
</script>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Room</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef2f7;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d8dee8;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bubble-me: #2563eb;
      --bubble-other: #eef2f7;
      --danger: #dc2626;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.16), transparent 30%),
        linear-gradient(135deg, #eef2f7 0%, #f8fafc 48%, #e8eef7 100%);
      color: var(--text);
      padding: 20px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: min(100%, 920px);
      height: min(760px, calc(100vh - 40px));
      min-height: 560px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(216, 222, 232, 0.9);
      border-radius: 8px;
      box-shadow: 0 24px 80px rgba(23, 32, 51, 0.14);
      backdrop-filter: blur(14px);
    }

    .login {
      grid-row: 1 / -1;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--panel);
    }

    .login-box {
      width: min(100%, 420px);
      display: grid;
      gap: 14px;
    }

    .login-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .login-copy {
      margin: 0 0 6px;
      color: var(--muted);
      line-height: 1.5;
    }

    .login-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    .field,
    .message-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      outline: none;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .field {
      height: 46px;
      padding: 0 14px;
    }

    .message-input {
      min-height: 46px;
      max-height: 130px;
      resize: none;
      padding: 12px 14px;
      line-height: 1.35;
    }

    .field:focus,
    .message-input:focus {
      border-color: rgba(37, 99, 235, 0.75);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .primary-btn,
    .icon-btn {
      height: 46px;
      display: inline-grid;
      place-items: center;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      transition: background 160ms ease, transform 120ms ease;
    }

    .primary-btn {
      padding: 0 18px;
    }

    .icon-btn {
      width: 46px;
    }

    .primary-btn:hover,
    .icon-btn:hover {
      background: var(--primary-dark);
    }

    .primary-btn:active,
    .icon-btn:active {
      transform: translateY(1px);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .room-title {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 800;
    }

    .room-text {
      min-width: 0;
    }

    .room-text h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-text p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .ghost-btn,
    .danger-btn {
      height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      background: var(--panel-soft);
      color: var(--text);
      font-weight: 700;
      border: 1px solid var(--line);
    }

    .danger-btn {
      color: var(--danger);
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 18px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)),
        repeating-linear-gradient(45deg, transparent 0 16px, rgba(37, 99, 235, 0.035) 16px 17px);
    }

    .empty {
      margin: auto;
      width: min(100%, 360px);
      padding: 28px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
    }

    .msg {
      display: grid;
      max-width: min(76%, 560px);
      gap: 4px;
    }

    .msg.me {
      align-self: flex-end;
      justify-items: end;
    }

    .msg.other {
      align-self: flex-start;
      justify-items: start;
    }

    .meta {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      padding: 0 4px;
    }

    .bubble {
      width: fit-content;
      max-width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.42;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .me .bubble {
      background: var(--bubble-me);
      color: #fff;
      border-top-right-radius: 3px;
    }

    .other .bubble {
      background: var(--bubble-other);
      color: var(--text);
      border-top-left-radius: 3px;
    }

    .composer {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }

    .emoji-wrap {
      position: relative;
    }

    .emoji-panel {
      position: absolute;
      left: 0;
      bottom: 56px;
      width: min(320px, calc(100vw - 28px));
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 44px rgba(23, 32, 51, 0.16);
      z-index: 5;
    }

    .emoji-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: transparent;
      font-size: 20px;
      line-height: 1;
    }

    .emoji-btn:hover,
    .emoji-btn:focus {
      background: var(--panel-soft);
      outline: none;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }

      .login-form {
        grid-template-columns: 1fr;
      }

      .primary-btn {
        width: 100%;
      }

      .app-header {
        align-items: flex-start;
        padding: 14px;
      }

      .header-actions {
        flex-direction: column;
      }

      .ghost-btn,
      .danger-btn {
        width: 40px;
        padding: 0;
        font-size: 0;
        position: relative;
      }

      .ghost-btn::before {
        content: "G";
        font-size: 14px;
      }

      .danger-btn::before {
        content: "X";
        font-size: 14px;
      }

      .messages {
        padding: 14px;
      }

      .msg {
        max-width: 88%;
      }

      .composer {
        grid-template-columns: auto 1fr auto;
        padding: 12px 14px 14px;
      }

      .emoji-panel {
        left: -2px;
        bottom: 54px;
        grid-template-columns: repeat(6, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="Aplikasi chat sederhana">
    <section id="loginScreen" class="login">
      <div class="login-box">
        <div>
          <h1 class="login-title">Masuk Chat</h1>
          <p class="login-copy">Isi username dulu, lalu mulai ngobrol di room lokal browser ini.</p>
        </div>
        <form id="loginForm" class="login-form" autocomplete="off">
          <input id="usernameInput" class="field" name="username" maxlength="24" placeholder="Username kamu" required>
          <button class="primary-btn" type="submit">Masuk</button>
        </form>
      </div>
    </section>

    <header id="chatHeader" class="app-header hidden">
      <div class="room-title">
        <div id="avatar" class="avatar" aria-hidden="true">U</div>
        <div class="room-text">
          <h1>Room Chat</h1>
          <p id="activeUser">Online sebagai -</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="changeUserBtn" class="ghost-btn" type="button" title="Ganti username">Ganti</button>
        <button id="clearBtn" class="danger-btn" type="button" title="Hapus semua chat">Hapus</button>
      </div>
    </header>

    <section id="messages" class="messages hidden" aria-live="polite"></section>

    <form id="chatForm" class="composer hidden" autocomplete="off">
      <div class="emoji-wrap">
        <button id="emojiToggle" class="icon-btn" type="button" title="Pilih emoticon" aria-label="Pilih emoticon">:)</button>
        <div id="emojiPanel" class="emoji-panel hidden" aria-label="Daftar emoticon"></div>
      </div>
      <textarea id="messageInput" class="message-input" name="message" rows="1" placeholder="Tulis pesan..." required></textarea>
      <button class="icon-btn" type="submit" title="Kirim pesan" aria-label="Kirim pesan">&gt;</button>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import {
      getDatabase,
      limitToLast,
      onValue,
      push,
      query,
      ref,
      remove
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    const USER_KEY = "simple-chat-username";
    const ROOM_ID = new URLSearchParams(window.location.search).get("room") || "private-room";

    const firebaseConfig = {
      apiKey: "AIzaSyAZoik0jOpDKIS0jLU2JLT2-sFiGkeEleI",
      authDomain: "chat-random-cfc2c.firebaseapp.com",
      databaseURL: "https://chat-random-cfc2c-default-rtdb.firebaseio.com",
      projectId: "chat-random-cfc2c",
      storageBucket: "chat-random-cfc2c.firebasestorage.app",
      messagingSenderId: "773337926036",
      appId: "1:773337926036:web:8ecec60f97428538b2a781",
      measurementId: "G-LDMM5SJZLW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, `rooms/${ROOM_ID}/messages`);
    const latestMessagesQuery = query(messagesRef, limitToLast(100));

    const loginScreen = document.getElementById("loginScreen");
    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("usernameInput");
    const chatHeader = document.getElementById("chatHeader");
    const activeUser = document.getElementById("activeUser");
    const avatar = document.getElementById("avatar");
    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const emojiToggle = document.getElementById("emojiToggle");
    const emojiPanel = document.getElementById("emojiPanel");
    const changeUserBtn = document.getElementById("changeUserBtn");
    const clearBtn = document.getElementById("clearBtn");
    const emojis = ["😀", "😁", "😂", "🤣", "😊", "😍", "😘", "🥰", "😎", "😅", "😢", "😭", "😡", "😴", "🤔", "👍", "🙏", "🔥", "✨", "❤️", "💙", "💕", "💌", "🌹"];

    let username = localStorage.getItem(USER_KEY) || "";
    let messages = [];
    let firebaseReady = false;

    onValue(latestMessagesQuery, (snapshot) => {
      firebaseReady = true;
      const data = snapshot.val() || {};
      messages = Object.entries(data)
        .map(([id, message]) => ({ id, ...message }))
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      renderMessages();
    }, (error) => {
      firebaseReady = false;
      renderError(`Firebase error: ${error.message}`);
    });

    loginForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const nextName = usernameInput.value.trim();
      if (!nextName) return;

      username = nextName.slice(0, 24);
      localStorage.setItem(USER_KEY, username);
      showChat();
    });

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    emojiPanel.innerHTML = emojis
      .map((emoji) => `<button class="emoji-btn" type="button" data-emoji="${emoji}" aria-label="Emoticon ${emoji}">${emoji}</button>`)
      .join("");

    emojiToggle.addEventListener("click", () => {
      emojiPanel.classList.toggle("hidden");
    });

    emojiPanel.addEventListener("click", (event) => {
      const button = event.target.closest("[data-emoji]");
      if (!button) return;
      insertAtCursor(button.dataset.emoji);
      emojiPanel.classList.add("hidden");
    });

    document.addEventListener("click", (event) => {
      if (event.target === emojiToggle || emojiPanel.contains(event.target)) return;
      emojiPanel.classList.add("hidden");
    });

    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = `${messageInput.scrollHeight}px`;
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    changeUserBtn.addEventListener("click", () => {
      usernameInput.value = username;
      showLogin();
    });

    clearBtn.addEventListener("click", () => {
      if (!confirm("Hapus semua chat di room ini?")) return;
      remove(messagesRef);
    });

    if (username) {
      showChat();
    } else {
      showLogin();
    }

    function showLogin() {
      loginScreen.classList.remove("hidden");
      chatHeader.classList.add("hidden");
      messagesEl.classList.add("hidden");
      chatForm.classList.add("hidden");
      usernameInput.focus();
    }

    function showChat() {
      loginScreen.classList.add("hidden");
      chatHeader.classList.remove("hidden");
      messagesEl.classList.remove("hidden");
      chatForm.classList.remove("hidden");
      activeUser.textContent = `Online sebagai ${username} - room ${ROOM_ID}`;
      avatar.textContent = username.charAt(0).toUpperCase();
      renderMessages();
      messageInput.focus();
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || !username) return;

      const message = {
        user: username,
        text,
        createdAt: Date.now()
      };

      messageInput.value = "";
      messageInput.style.height = "auto";
      messageInput.focus();

      try {
        await push(messagesRef, message);
      } catch (error) {
        messageInput.value = text;
        renderError(`Gagal kirim pesan: ${error.message}`);
      }
    }

    function insertAtCursor(value) {
      const start = messageInput.selectionStart;
      const end = messageInput.selectionEnd;
      const before = messageInput.value.slice(0, start);
      const after = messageInput.value.slice(end);

      messageInput.value = `${before}${value}${after}`;
      messageInput.selectionStart = start + value.length;
      messageInput.selectionEnd = start + value.length;
      messageInput.dispatchEvent(new Event("input"));
      messageInput.focus();
    }

    function renderMessages() {
      messagesEl.innerHTML = "";

      if (!messages.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = firebaseReady
          ? "Belum ada chat. Kirim pesan pertama buat mulai."
          : "Menghubungkan ke Firebase...";
        messagesEl.appendChild(empty);
        return;
      }

      const fragment = document.createDocumentFragment();

      messages.forEach((message) => {
        const item = document.createElement("article");
        item.className = `msg ${message.user === username ? "me" : "other"}`;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = `${message.user} - ${formatTime(message.createdAt)}`;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = message.text;

        item.append(meta, bubble);
        fragment.appendChild(item);
      });

      messagesEl.appendChild(fragment);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderError(message) {
      messagesEl.innerHTML = "";
      const errorBox = document.createElement("div");
      errorBox.className = "empty";
      errorBox.textContent = message;
      messagesEl.appendChild(errorBox);
    }

    function formatTime(value) {
      return new Intl.DateTimeFormat("id-ID", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }
  </script>
</body>
</html>

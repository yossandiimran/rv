<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Byy 🤍</title>
  <style>
    :root{font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;}
    body{display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#f6f7fb}
    .card{background:white;padding:28px;border-radius:12px;box-shadow:0 6px 18px rgba(20,20,40,0.08);text-align:center;width:320px}
    button{padding:10px 16px;border-radius:8px;border:0;background:#5b21b6;color:white;font-weight:600;cursor:pointer}
    #output{margin-top:18px;font-size:20px;color:#111}
    .name{font-size:22px;font-weight:700}
    .heart{color:#e11d48;margin-left:8px}
    .love{font-size:16px;color:#6b7280;margin-top:6px}
  </style>
</head>
<body>
  <div class="card">
    <button id="btn">Klik ini byy</button>
    <div id="output" aria-live="polite"></div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const out = document.getElementById('output');

    btn.addEventListener('click', () => {
      out.innerHTML = `
        <div class="name">Love U sayangg <span id="heart" class="heart">🤍</span></div>
        <div class="love" id="loveText">klik lagi hati putih nya</div>
      `;

      const heart = document.getElementById('heart');
      const loveText = document.getElementById('loveText');

      heart.addEventListener('click', () => {
        spawnGlitchHearts();
      });
    });

    function spawnGlitchHearts() {
      for (let i = 0; i < 50; i++) {
        const h = document.createElement('div');
        h.textContent = '❤';
        h.style.position = 'fixed';
        h.style.left = Math.random() * window.innerWidth + 'px';
        h.style.top = Math.random() * window.innerHeight + 'px';
        h.style.fontSize = (20 + Math.random() * 40) + 'px';
        h.style.color = '#e11d48';
        h.style.opacity = '1';
        h.style.pointerEvents = 'none';
        h.style.transform = 'translate(0,0)';
        h.style.transition = 'transform 0.2s ease, opacity 0.4s ease';
        document.body.appendChild(h);

        setTimeout(() => {
          const randX = (Math.random() * 600 - 300) + 'px';
          const randY = (Math.random() * 600 - 300) + 'px';
          h.style.transform = `translate(${randX}, ${randY}) rotate(${Math.random()*180}deg)`;
          h.style.opacity = '0';
        }, 30 + i * 10);

        setTimeout(() => {
          h.remove();
        }, 700);
      }
    }
  </script>
</body>
</html>

<script>// =====================================================================

const cv=document.getElementById("c");let ctx=cv.getContext("2d");const W=1280,H=720,FLOOR=630,INK="#1b1209";

function path(pts,close){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath()}
function fs(fill,lw){if(fill){ctx.fillStyle=fill;ctx.fill()}ctx.lineWidth=lw||5;ctx.strokeStyle=INK;ctx.lineJoin="round";ctx.lineCap="round";ctx.stroke()}
function blob(x,y,rx,ry,fill,s,rot,lw){s=s||0;ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.beginPath();const n=16,b=bt();for(let i=0;i<=n;i++){const a=i/n*TAU,r=1+Math.sin(a*3+s+b*1.9)*.03+Math.sin(a*5+s*2+b*2.7)*.022;const px=Math.cos(a)*rx*r,py=Math.sin(a)*ry*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();fs(fill,lw);ctx.restore()}

function hose(p0,p1,bend,wid,fill){const mx=(p0[0]+p1[0])/2+bend[0],my=(p0[1]+p1[1])/2+bend[1];ctx.lineCap="round";ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.quadraticCurveTo(mx,my,p1[0],p1[1]);ctx.strokeStyle=INK;ctx.lineWidth=wid+8;ctx.stroke();ctx.strokeStyle=fill;ctx.lineWidth=wid;ctx.stroke()}

function candiBentar(x,base,w,h,col){const gap=w*.09,hw=w/2;for(const sx of[-1,1]){const pts=[[x+sx*gap,base],[x+sx*hw,base]];for(let k=0;k<8;k++){const ow=hw*(1-k*.085),y0=base-h*k/8,y1=base-h*(k+1)/8;pts.push([x+sx*ow,y0-3],[x+sx*ow,y1+3]);pts.push([x+sx*(ow-hw*.085),y1+3])}pts.push([x+sx*gap,base-h]);ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.closePath();fs(col,5);ctx.strokeStyle="rgba(27,18,9,.45)";ctx.lineWidth=2;for(let k=1;k<8;k++){ctx.beginPath();ctx.moveTo(x+sx*gap,base-h*k/8);ctx.lineTo(x+sx*hw*(1-k*.085),base-h*k/8);ctx.stroke()}}}
function mountain(x,base,w,h,col,smoke){ctx.beginPath();ctx.moveTo(x-w/2,base);ctx.quadraticCurveTo(x-w*.15,base-h*.9,x-w*.04,base-h);ctx.lineTo(x+w*.04,base-h);ctx.quadraticCurveTo(x+w*.15,base-h*.9,x+w/2,base);ctx.closePath();fs(col,5);if(smoke){cloud(x+10,base-h-40,.6)}}

function ricefield(y0,col1,col2){for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo(0,y0+i*26);for(let x=0;x<=W;x+=80)ctx.lineTo(x,y0+i*26+Math.sin(x*.01+i)*10);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();fs(i%2?col1:col2,3)}}
function buildBG(i){const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
 const real=ctx;ctx=x;

 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);x.fillStyle=g;x.fillRect(0,0,W,H);
 sunburst(W/2,300,1400,th.ray[0],th.ray[1],28);
 x.beginPath();x.arc(W/2,300,170,0,TAU);fs(th.sun,6);if(i===3){x.fillStyle="#0a0610";x.beginPath();x.arc(W/2+24,296,160,0,TAU);x.fill();x.strokeStyle="#ffcf70";x.lineWidth=5;x.beginPath();x.arc(W/2,300,176,0,TAU);x.stroke()}
 if(i<3){cloud(120,170,1.2);cloud(980,120,1.5);cloud(560,70,.9)}
 if(i===0){mountain(220,560,520,360,"#6aa070",true);mountain(1040,560,640,300,"#5a9060");candiBentar(640,560,520,360,"#c08a5a");palm(110,600,320,40);palm(1180,610,360,-50);ricefield(560,"#9ac040","#7aa030")}

  for(const [bx,by] of[[160,520],[330,500]]){x.beginPath();x.moveTo(bx-70,by);x.quadraticCurveTo(bx,by+40,bx+70,by);x.lineTo(bx+54,by-14);x.lineTo(bx-54,by-14);x.closePath();fs("#b8683a",5);x.beginPath();x.moveTo(bx,by-14);x.lineTo(bx,by-130);x.lineTo(bx+60,by-30);x.closePath();fs("#fff0cc",4)}
  palm(60,560,300,30)}
 if(i===2){candiBentar(240,600,360,400,"#7a4a6a");candiBentar(1040,600,360,400,"#7a4a6a");mountain(640,520,700,260,"#4a2a52");for(let k=0;k<6;k++){x.fillStyle="rgba(255,200,120,.5)";x.beginPath();x.arc(100+k*220,100+((k*57)%90),4,0,TAU);x.fill()}}
 if(i===3){for(let k=0;k<50;k++){x.fillStyle="rgba(255,240,200,"+(.3+((k*37)%7)/10)+")";x.beginPath();x.arc((k*263)%W,(k*97)%380,1.5+((k*13)%3),0,TAU);x.fill()}mountain(260,560,620,300,"#1c1230");mountain(1040,560,640,340,"#190f2a");candiBentar(640,570,560,380,"#2e2038")}
 // tanah

 ctx=real;BGC[i]=c}

// ---------- pahlawan: Wira ----------
const SKIN="#f0b878",KAIN="#2f4aa0",EMAS="#f2c230";
function drawHero(p){ctx.save();ctx.translate(p.x,p.y);
 // bayangan
 ctx.fillStyle="rgba(20,10,0,.28)";ctx.beginPath();ctx.ellipse(0,2,28,7,0,0,TAU);ctx.fill();
 ctx.scale(p.face*.8,.8);if(p.inv>0&&!p.sup&&Math.floor(T*22)%2)ctx.globalAlpha=.4;

 // kain batik

 ctx.save();ctx.clip();ctx.strokeStyle=EMAS;ctx.lineWidth=2.5;for(let i=-3;i<4;i++){ctx.beginPath();ctx.arc(i*10,by-8,5,0,Math.PI);ctx.stroke();ctx.beginPath();ctx.arc(i*10+5,by-16,5,Math.PI,TAU);ctx.stroke()}ctx.restore();
 ctx.fillStyle=EMAS;ctx.fillRect(-16,by-24,32,6);fs(null,3);ctx.strokeRect(-16,by-24,32,6);

 // selendang

 {const sw=air?10:run?6:3;ctx.beginPath();ctx.moveTo(-14,ty-14);for(let i=1;i<=6;i++)ctx.lineTo(-14-i*9,ty-14+Math.sin(T*9+i)*sw+i*(air?-2:3));ctx.strokeStyle=INK;ctx.lineWidth=11;ctx.stroke();ctx.strokeStyle="#e04a2a";ctx.lineWidth=6;ctx.stroke()}
 // lengan belakang
 const shx=-6,shy=ty-8;hose([shx,shy],[-18,ty+(run?Math.sin(ph)*10:8)],[-4,6],10,SKIN);glove(-19,ty+(run?Math.sin(ph)*10:10),9);
 // kepala
 const hy=ty-34+bob*.3;blob(2,hy,25,25,SKIN,1,0,5);shine(-8,hy-12,6,10,.4);
 for(const sx of[-23,25]){blob(sx,hy+2,5,7,SKIN,sx,0,3)}
 // rambut & udeng
 ctx.beginPath();ctx.arc(2,hy-4,26,Math.PI*1.02,Math.PI*1.98);ctx.closePath();fs("#1a1008",4);
 ctx.beginPath();ctx.moveTo(-23,hy-12);ctx.quadraticCurveTo(2,hy-26,27,hy-12);ctx.lineTo(27,hy-4);ctx.quadraticCurveTo(2,hy-16,-23,hy-4);ctx.closePath();fs("#d8402a",4);
 ctx.fillStyle=EMAS;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-12+i*9,hy-12+(i%2?2:-1),2.2,0,TAU);ctx.fill()}
 blob(-26,hy-18,10,8,"#d8402a",5,.3,4);path([[-30,hy-14],[-44,hy-6+Math.sin(T*8)*3],[-38,hy+2]],false);fs("#d8402a",4);
 // wajah
 const ex=p.hitT>0?0:1;eye(8,hy,8,11,1,0,2);eye(22,hy,7,10,1,0,3);

const STORY=[
 {t:"Tahun 1350 Saka",p:"Majapahit berjaya di bawah Prabu Hayam Wuruk. Dari Trowulan hingga Bali, dari Canggu hingga timur Nusantara, nama sang Patih Gajah Mada disebut dengan hormat.<br><br>Namun pagi itu, fajar tak kunjung datang. Gerhana yang tak mau berlalu menggantung di langit Jawa."},
 {t:"Cakra Surya",p:"Wira, prajurit muda penjaga gerbang Trowulan, dipanggil ke balairung. Sang Patih menyerahkan Cakra Surya — pusaka yang menyimpan secuil cahaya matahari.<br><br><i>“Empat penjaga tanah ini terbangun murka. Redakan amarah mereka satu per satu, lalu hadapi Sang Kala yang menelan mentari.”</i>"}];
const ST_BOSS=[
 "<b>Hutan Timun.</b> Buto Ijo mengamuk di sawah-sawah timur Trowulan. Batu-batu beterbangan dan tanah bergetar setiap kali kakinya menghentak. Petani mengungsi — hanya Wira yang berani maju.<br><br><span class=tip>Petunjuk: loncat di atas gelombang tanah. Benda berwarna <b style='color:#e0508a'>MERAH MUDA</b> bisa di-<b>parry</b> dengan menekan lompat lagi di udara.</span>",

 const extra=n.t==="stage"?`<div class=sm>Koin pusaka: ${(SAVE.pc[n.id]||[]).filter(Boolean).length}/5</div>`:(done&&done!==1?`<div class=sm>Peringkat terbaik: ${done}</div>`:"");

 else if(tab==="c")rows=`<div class=sm>Pasang maksimal 2 jimat (${SAVE.che.length}/2)</div>`+CHARM.map((c,i)=>{const o=SAVE.ch.includes(c.id),e=SAVE.che.includes(c.id);return`<div class=srow><div><b>${c.n}</b>${e?" <i class=tg>DIPASANG</i>":""}<small>${c.d}</small></div><div class=sbt>${o?`<button class=sb onclick="togCharm('${c.id}')">${e?"LEPAS":"PASANG"}</button>`:`<button class="sb buy" ${SAVE.coins<c.price?"disabled":""} onclick="buy('c',${i})">BELI ${c.price}</button>`}</div></div>`}).join("");

function buy(t,i){let pr,ok=false;if(t==="w"){pr=WEAP[i].price;if(SAVE.coins>=pr&&!SAVE.w.includes(i)){SAVE.w.push(i);ok=true}}else if(t==="c"){pr=CHARM[i].price;if(SAVE.coins>=pr&&!SAVE.ch.includes(CHARM[i].id)){SAVE.ch.push(CHARM[i].id);ok=true}}else{const u=UPG[i],lv=SAVE.up[u.id];pr=u.prices[lv];if(pr!==undefined&&SAVE.coins>=pr){SAVE.up[u.id]++;ok=true}}
 if(ok){SAVE.coins-=pr;save();AU.sfx("buy")}else AU.sfx("nope");shop(t)}

{const map={bJump:"jump",bShoot:"shoot",bDash:"dash",bSup:"sup",bSwap:"swap"};for(const id in map){const b=$(id);const k=map[id];const on=e=>{e.preventDefault();TCH[k]=1;b.classList.add("on")},off=e=>{e.preventDefault();TCH[k]=0;b.classList.remove("on")};b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false});b.addEventListener("touchcancel",off,{passive:false})}

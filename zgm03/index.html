 while(st.length){const[x,y]=st[st.length-1];let mv=false;for(const[dx,dy]of sh([[2,0],[-2,0],[0,2],[0,-2]])){const nx=x+dx,ny=y+dy;if(nx>0&&ny>0&&nx<S-1&&ny<S-1&&g[ny][nx]===1){g[y+dy/2][x+dx/2]=0;g[ny][nx]=0;st.push([nx,ny]);mv=true;break}}if(!mv)st.pop()}
 for(let i=0;i<S*3;i++){const x=1+Math.floor(R()*(S-2)),y=1+Math.floor(R()*(S-2));if(g[y][x]===1&&((g[y][x-1]===0&&g[y][x+1]===0)||(g[y-1][x]===0&&g[y+1][x]===0)))g[y][x]=0}
 for(let k=0;k<Math.floor(S/4);k++){const w=R()<.5?3:5,h=R()<.5?3:5;const nx=Math.floor((S-1-w-1)/2)+1,ny=Math.floor((S-1-h-1)/2)+1;const x=1+2*Math.floor(R()*nx),y=1+2*Math.floor(R()*ny);if(x+w>S-1||y+h>S-1)continue;if(x<6&&y<6)continue;for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)g[yy][xx]=0}
 for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(g[y][x]===1)g[y][x]=(x===0||y===0||x===S-1||y===S-1)?2:1+(((x>>2)+(y>>2))%4);
 g[1][1]=0;g[1][2]=0;g[2][1]=0;
 const d=bfs(g,S,1,1);const cells=[];let far=0,fc=null;for(let y=0;y<S;y++)for(let x=0;x<S;x++)if(g[y][x]===0&&d[y][x]>=0){cells.push([x,y,d[y][x]]);if(d[y][x]>far){far=d[y][x];fc=[x,y]}}
 sh(cells);const used=new Set([fc[0]+","+fc[1]]);
 const pick=(min,max)=>{for(let i=0;i<cells.length;i++){const c=cells[i];if(c[2]>=min&&(max===undefined||c[2]<=max)&&!used.has(c[0]+","+c[1])){used.add(c[0]+","+c[1]);cells.splice(i,1);return c}}const c=cells.pop();return c};
 const ent=[];const mk=(k,c,o)=>ent.push(Object.assign({k,x:c[0]+.5,y:c[1]+.5,dead:0},o));

 return {g,S,ent,exit:{x:fc[0]+.5,y:fc[1]+.5}}}

const RAY={t:0,side:0,tile:0,mx:0,my:0};
function ray(ox,oy,rdx,rdy){if(rdx===0)rdx=1e-9;if(rdy===0)rdy=1e-9;let mx=Math.floor(ox),my=Math.floor(oy);const ddx=Math.abs(1/rdx),ddy=Math.abs(1/rdy);let sx,sy,sdx,sdy;
 if(rdx<0){sx=-1;sdx=(ox-mx)*ddx}else{sx=1;sdx=(mx+1-ox)*ddx}if(rdy<0){sy=-1;sdy=(oy-my)*ddy}else{sy=1;sdy=(my+1-oy)*ddy}
 let side=0,t=0;for(let i=0;i<80;i++){if(sdx<sdy){t=sdx;sdx+=ddx;mx+=sx;side=0}else{t=sdy;sdy+=ddy;my+=sy;side=1}

 q("bP").onclick=()=>{actx();fs();if(!SV.seen){SV.seen=1;persist()}showMissions()};q("bH").onclick=showHelp;if(c)q("bN").onclick=()=>{if(confirm("Hapus progres?")){SV.unlocked=1;persist();showMenu()}}}
function fs(){try{const e=document.documentElement;if(e.requestFullscreen&&!document.fullscreenElement)e.requestFullscreen().then(()=>{try{screen.orientation.lock("landscape")}catch(_){}}).catch(()=>{})}catch(_){}}
function showHelp(){show(`<h2>Cara Bermain</h2><div style="max-width:36em;text-align:left"><p><b>HP:</b> Joystick kiri = jalan • geser layar kanan = melihat • TEMBAK • ISI ULANG • GANTI SENJATA • GUNAKAN (tahan di dekat bom).</p><p><b>PC:</b> WASD gerak • mouse lihat (klik layar) • klik kiri/Spasi tembak • R isi ulang • Q atau 1/2/3 ganti senjata • F tahan jinakkan bom • Shift lari • P jeda.</p><p>🎯 Bunuh teroris, 🔵 sentuh sandera untuk bebaskan (jangan tembak!), 🟡 jinakkan bom, lalu menuju pintu hijau. Radar kecil menunjukkan sandera dan bom.</p></div><button class="b" id="bb">Kembali</button>`);q("bb").onclick=showMenu}
function showMissions(){let c="";MISSIONS.forEach((m,i)=>{const lock=i+1>SV.unlocked;c+=`<div class="card ${lock?"lock":""}"><b>${i+1}. ${m.n}</b><br><span class="sub">${m.obj}</span><br><button class="b" style="padding:.25em .9em" data-m="${i}" ${lock?"disabled":""}>${lock?"🔒":"Mulai"}</button></div>`});
 show(`<h2>Pilih Misi</h2><div class="row" style="max-width:48em">${c}</div><button class="b alt" id="bM">Menu</button>`);ui.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>brief(+b.dataset.m));q("bM").onclick=showMenu}
function dlg(lines,done){let i=0;const step=()=>{if(i>=lines.length){done();return}const[w,t]=lines[i++];show(`<div class="dlg"><b>${w}</b><p>${t}</p></div><button class="b" id="bX">${i>=lines.length?"Lanjut ▶":"Berikutnya ▶"}</button>`);q("bX").onclick=step};step()}
function brief(i){dlg(MISSIONS[i].br,()=>{show(`<h2>Misi ${i+1}: ${MISSIONS[i].n}</h2><p>🎯 ${MISSIONS[i].obj}</p><div class="row"><button class="b" id="bG">⚔ MASUK</button><button class="b alt" id="bB">Kembali</button></div>`);q("bG").onclick=()=>{actx();fs();startMission(i)};q("bB").onclick=showMissions})}
function showEnd(w){const m=MISSIONS[G.mi],acc=G.shots?Math.round(G.hits/G.shots*100):0;
 if(w){const last=G.mi===3;show(`<h2>Misi Selesai!</h2><p style="max-width:30em">${m.post}</p><p class="sub">Teroris: ${G.kills}/${G.total} • Akurasi ${acc}% • HP ${Math.ceil(P.hp)} • Waktu ${Math.floor(G.t)} dtk</p><div class="row">${last?"":'<button class="b" id="bN">Misi Berikutnya ▶</button>'}<button class="b alt" id="bM">Pilih Misi</button></div>${last?'<h1 style="margin-top:.5em">TAMAT</h1><p>Selamat, Satuan Garuda! Serigala Merah dihancurkan.</p>':""}`);if(!last)q("bN").onclick=()=>brief(G.mi+1);q("bM").onclick=showMissions}
 else{show(`<h2 style="color:#ff5a4a">Misi Gagal</h2><p>${G.endMsg||""}</p><div class="row"><button class="b" id="bR">↻ Ulangi</button><button class="b alt" id="bM">Pilih Misi</button></div>`);q("bR").onclick=()=>startMission(G.mi);q("bM").onclick=showMissions}}
// ================= INPUT =================
addEventListener("keydown",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=1;if(e.key==="Shift")keys.Shift=1;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
 if(!G||G.state!=="play")return;if(k==="p"||k==="Escape")togglePause();if(k==="q")swap();if(k==="1"){if(P.w!==0&&!P.reload){P.w=0;P.sw=.25}}if(k==="2"){if(P.w!==1&&!P.reload){P.w=1;P.sw=.25}}if(k==="3"){if(P.w!==2&&!P.reload){P.w=2;P.sw=.25}}});
addEventListener("keyup",e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=0;if(e.key==="Shift")keys.Shift=0});
function togglePause(){if(!G||G.state!=="play")return;G.pause=!G.pause;if(G.pause)try{document.exitPointerLock()}catch(e){}}
cv.addEventListener("mousedown",e=>{if(TOUCH||!G||G.state!=="play")return;if(G.pause){G.pause=0;return}if(!document.pointerLockElement&&cv.requestPointerLock)try{cv.requestPointerLock()}catch(_){}keys.mouse=1;actx()});
addEventListener("mouseup",()=>{keys.mouse=0});
addEventListener("mousemove",e=>{if(document.pointerLockElement===cv&&G&&G.state==="play")lookAcc+=e.movementX*.0032});
// sentuh
const tp=q("tp"),joy=q("joy"),knob=q("knob");let jid=null,jox=0,joy0=0,lid=null,llx=0;
tp.addEventListener("pointerdown",e=>{e.preventDefault();actx();if(G&&G.pause){G.pause=0;return}if(e.clientX<innerWidth*.5){if(jid===null){jid=e.pointerId;jox=e.clientX;joy0=e.clientY;joy.style.display="block";joy.style.left=jox-60+"px";joy.style.top=joy0-60+"px";knob.style.left="34px";knob.style.top="34px"}}else if(lid===null){lid=e.pointerId;llx=e.clientX}});
tp.addEventListener("pointermove",e=>{e.preventDefault();if(e.pointerId===jid){let dx=e.clientX-jox,dy=e.clientY-joy0;const l=Math.hypot(dx,dy),m=50;if(l>m){dx*=m/l;dy*=m/l}knob.style.left=34+dx+"px";knob.style.top=34+dy+"px";jx=Math.abs(dx)<8?0:dx/m;jy=Math.abs(dy)<8?0:dy/m}else if(e.pointerId===lid){lookAcc+=(e.clientX-llx)*.0075*(W/innerWidth*1.6);llx=e.clientX}});
const up=e=>{if(e.pointerId===jid){jid=null;jx=jy=0;joy.style.display="none"}if(e.pointerId===lid)lid=null};tp.addEventListener("pointerup",up);tp.addEventListener("pointercancel",up);
function btn(id,fn,fnUp){const b=q(id);b.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();b.classList.add("on");actx();fn()});const u=e=>{e.preventDefault();b.classList.remove("on");if(fnUp)fnUp()};b.addEventListener("pointerup",u);b.addEventListener("pointercancel",u);b.addEventListener("pointerleave",u)}
btn("bF",()=>touchFire=1,()=>touchFire=0);btn("bU",()=>touchUse=1,()=>touchUse=0);btn("bR",()=>{if(G)startReload()});btn("bW",()=>{if(G)swap()});btn("bP",()=>togglePause());
document.addEventListener("visibilitychange",()=>{if(document.hidden&&G&&G.state==="play")G.pause=1});
// ================= LOOP =================
let last=0;function loop(ts){requestAnimationFrame(loop);const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(G){update(dt);render()}else{ctx.fillStyle="#0b0d10";ctx.fillRect(0,0,W,H)}}
window.__t={startMission,update,render,get G(){return G},get P(){return P},get ENT(){return ENT},get MAP(){return MAP},keys,genLevel,get EXIT(){return EXIT},swap,shoot,startReload,showEnd,showMenu,showMissions,brief,MISSIONS};
showMenu();requestAnimationFrame(loop);
</script>

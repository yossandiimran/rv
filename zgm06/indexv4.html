  if(p.warn>0){p.warn-=dt;if(p.warn<=0&&p.k==="faller"){p.vy=900}if(p.warn>0)continue}
  if(p.k==="leyak"){if(p.flash>0)p.flash-=dt;const a=Math.atan2(P.y-60-p.y,P.x-p.x);p.vx=lerp(p.vx,Math.cos(a)*150,dt*1.5);p.vy=lerp(p.vy,Math.sin(a)*150+Math.sin(p.t*3)*70,dt*1.5);p.x+=p.vx*dt;p.y+=p.vy*dt;if(!P.dead&&circHit(p.x,p.y,p.r*.8))hurtP();continue}

  if(p.k==="tongue"){p.warn=0;if(p.t<.5){const ex=p.x+Math.cos(p.ang)*p.len,ey=p.y+Math.sin(p.ang)*p.len,cx=P.x,cy=P.y-42;const dx=ex-p.x,dy=ey-p.y,l2=dx*dx+dy*dy;let t=((cx-p.x)*dx+(cy-p.y)*dy)/l2;t=clamp(t,0,1);if(t>.1&&Math.hypot(p.x+dx*t-cx,p.y+dy*t-cy)<p.wid/2+22)hurtP()}continue}
  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.spin)p.rot=(p.rot||0)+p.spin*dt;
  if(p.k==="rock"&&p.y>=FLOOR-30){p.dead=true;G.shake=Math.max(G.shake,10);AU.sfx("slam");for(let s=0;s<3;s++)sp("shard",p.x,FLOOR-30,(s-1)*260,-rnd(420,620),{r:13,g:1500});G.burst(p.x,FLOOR-10,10,"#b8a890")}
  else if(p.k==="faller"&&p.y>=FLOOR-28){p.dead=true;G.shake=Math.max(G.shake,8);G.burst(p.x,FLOOR-10,8,"#b8a890")}
  else if(p.k==="shard"&&p.y>FLOOR)p.dead=true;
  if(p.x<cam-200||p.x>cam+W+250||p.y>H+100||(p.y<-300&&p.k!=="faller"))p.dead=true;

  if(p.rect){const x0=p.x-p.w/2,x1=p.x+p.w/2;if(rectHit(x0,FLOOR-p.h,x1,FLOOR))hurtP()}else if(circHit(p.x,p.y,(p.r||12)*.85))hurtP()}

$("c").addEventListener("pointermove",e=>{if(G.st!=="mg")return;const m=G.mg,[x,y]=cvPos(e);m.mx=x;m.my=y;if(m.kind==="archery"){m.cx=x;m.cy=y}});
function shootAt(x,y){const m=G.mg;if(!m||m.state!=="play")return;m.shots++;let hit=false;for(const t of m.tg){if(t.dead)continue;if(Math.hypot(t.x-x,t.y-y)<t.r+6){t.dead=true;t.dt=0;m.hits++;m.combo++;hit=true;m.fx.push({x:t.x,y:t.y-t.r,t:0,txt:t.r<34?"+1 TEPAT!":"+1",c:t.r<34?"#ffd040":"#fff"});AU.sfx("hit");break}}if(!hit){m.combo=0;AU.sfx("whip")}else AU.sfx("coin")}
function updateMG(dt){const m=G.mg;if(!m)return;m.t+=dt;if(m.state==="intro"){if(m.t>=m.it){m.state="play";m.t=0}return}if(m.state!=="play")return;
 for(let i=m.fx.length-1;i>=0;i--){m.fx[i].t+=dt;if(m.fx[i].t>.7)m.fx.splice(i,1)}
 if(m.kind==="rhythm"){for(let i=0;i<4;i++)m.flash[i]=Math.max(0,m.flash[i]-dt);for(const n of m.notes)if(!n.s&&m.t>n.t+.25){n.s=-1;m.combo=0}if(m.t>m.len){m.state="end";endMG()}}
 else if(m.kind==="fish"){const h=K("Space","KeyZ","KeyW","ArrowUp","Enter")||m.hold||TCH.jump;m.bv+=((h?-1100:1000))*dt;m.bv=Math.max(-420,Math.min(520,m.bv));m.bar+=m.bv*dt;if(m.bar<0){m.bar=0;m.bv=Math.abs(m.bv)*.3}if(m.bar>460){m.bar=460;m.bv=-Math.abs(m.bv)*.25}
  m.ft-=dt;if(m.ft<=0){m.ft=.7+Math.random()*.9;m.ftarget=Math.random()*420}m.fy+=(m.ftarget-m.fy)*Math.min(1,dt*1.6*m.fsp);
  const ov=m.fy+20>m.bar&&m.fy+20<m.bar+120;m.ov=ov;m.prog+=(ov?.26:-.17)*dt;if(m.prog>=1){m.caught++;m.prog=.3;m.fsp+=.25;m.fl=.8;AU.sfx("coin");m.fx.push({x:640,y:300,t:0,txt:"IKAN!",c:"#ffd040"})}if(m.prog<=0)m.prog=.05;m.fl=Math.max(0,m.fl-dt);if(m.t>m.len){m.state="end";endMG()}}
 else{const sp=500*dt;if(K("ArrowLeft","KeyA"))m.cx-=sp;if(K("ArrowRight","KeyD"))m.cx+=sp;if(K("ArrowUp","KeyW"))m.cy-=sp;if(K("ArrowDown","KeyS"))m.cy+=sp;m.cx=Math.max(0,Math.min(W,m.cx));m.cy=Math.max(100,Math.min(H,m.cy));
  m.sp-=dt;if(m.sp<=0&&m.tg.filter(t=>!t.dead).length<4){m.sp=.55+Math.random()*.5-m.t*.004;const r=m.t>20&&Math.random()<.5?28:46;m.tg.push({x:160+Math.random()*(W-320),y:230+Math.random()*(H-330),r,max:1.9-m.t*.01,life:0,dead:false,dt:0})}
  for(const t of m.tg){if(t.dead)t.dt+=dt;else{t.life+=dt;if(t.life>t.max){t.dead=true;t.dt=9;m.combo=0}}}m.tg=m.tg.filter(t=>!t.dead||t.dt<.3);if(m.t>m.len){m.state="end";endMG()}}}
function mgBG(c1,c2){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
function mgText(t,x,y,s,c){ctx.save();ctx.font="900 "+s+"px Impact";ctx.textAlign="center";ctx.lineWidth=s/6;ctx.strokeStyle=INK;ctx.fillStyle=c||"#fff6dc";ctx.strokeText(t,x,y);ctx.fillText(t,x,y);ctx.restore()}

 if(m.kind==="rhythm"){mgBG("#3a1a40","#8a3a30");for(let i=0;i<14;i++){ctx.fillStyle="rgba(255,200,100,"+(.08+.05*Math.sin(T*2+i))+")";ctx.beginPath();ctx.arc(80+i*92,100+Math.sin(T+i)*20,26,0,TAU);ctx.fill()}
  for(let i=0;i<4;i++){const x=LX(i),f=m.flash[i]>0;ctx.fillStyle=f?"rgba(255,220,120,.4)":"rgba(255,255,255,.1)";ctx.fillRect(x,0,110,H);ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.strokeRect(x,0,110,H);ctx.save();ctx.translate(x+55,600);blob(0,0,46,26,f?"#ffe070":"#d8a040",i,0,5);blob(0,-4,16,10,"#7a4a10",i,0,3);ctx.restore();ctx.fillStyle="#fff6dc";ctx.font="bold 18px Georgia";ctx.textAlign="center";ctx.fillText(["A","S","K","L"][i],x+55,660)}
  for(const n of m.notes){if(n.s>0&&n.s)continue;const y=-40+(m.t-(n.t-1.6))/1.6*640;if(y<-50||y>H+40||n.s===-1&&y>H)continue;ctx.save();ctx.globalAlpha=n.s===-1?.3:1;ctx.translate(LX(n.l)+55,y);blob(0,0,40,22,["#e0502a","#f2c230","#5ac060","#5a90e0"][n.l],n.t*9,0,5);shine(-12,-8,10,5,.5);ctx.restore()}
  mgText("Skor: "+Math.round(m.hit)+"/"+m.total,170,70,34);mgText("Kombo "+m.combo+"×",170,120,28,"#ffd040");
  if(m.state==="intro")mgText("SIAP...",W/2,H/2,90)}
 else if(m.kind==="fish"){mgBG("#9ad8e8","#2a6a98");ctx.fillStyle="#e8d8a0";ctx.fillRect(0,560,W,160);ctx.save();ctx.translate(200,540);blob(0,0,60,30,"#8a5a28",1,0,5);ctx.restore();
  ctx.strokeStyle="rgba(255,255,255,.5)";ctx.lineWidth=4;for(let i=0;i<20;i++){const px=(i*97+T*30)%W;ctx.beginPath();ctx.moveTo(px,150+(i*53)%380);ctx.quadraticCurveTo(px+14,140+(i*53)%380,px+28,150+(i*53)%380);ctx.stroke()}
  // lintasan
  const x0=900,y0=120;ctx.fillStyle="rgba(10,40,70,.55)";ctx.fillRect(x0,y0,90,480);ctx.strokeStyle=INK;ctx.lineWidth=5;ctx.strokeRect(x0,y0,90,480);
  ctx.fillStyle=m.ov?"rgba(120,255,140,.8)":"rgba(255,230,120,.75)";ctx.fillRect(x0+4,y0+m.bar+4,82,112);ctx.save();ctx.translate(x0+45,y0+m.fy+24);blob(0,0,28,14,"#f08a2a",m.fy,0,4);path([[-26,0],[-40,-12],[-40,12]],true);fs("#f08a2a",3);eye(14,-3,4,4,1,0,1);ctx.restore();
  ctx.fillStyle="rgba(10,40,70,.6)";ctx.fillRect(1010,y0,34,480);ctx.fillStyle="#5ae07a";ctx.fillRect(1010,y0+480*(1-m.prog),34,480*m.prog);ctx.strokeStyle=INK;ctx.strokeRect(1010,y0,34,480);
  mgText("Tahan SPASI / sentuh untuk menaikkan kotak",420,90,28);mgText("Ikan: "+m.caught,200,240,50,"#ffd040");mgText("Sisa "+Math.max(0,Math.ceil(m.len-m.t))+"d",200,300,34);if(m.state==="intro")mgText("SIAP MEMANCING...",W/2,H/2,70)}
 else{mgBG("#a8d890","#5a9a50");for(let i=0;i<8;i++)palm(80+i*170,220+(i%2)*10,90,i%2?8:-8);ctx.fillStyle="#6aa04a";ctx.fillRect(0,260,W,460);
  for(const t of m.tg){const k=t.dead?Math.max(0,1-t.dt/.3):Math.min(1,t.life/.15)*(1-Math.max(0,(t.life-(t.max-.5))/.5)*.5);ctx.save();ctx.translate(t.x,t.y);ctx.scale(k,k);ctx.rotate(t.dead?t.dt*10:0);for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(0,0,t.r*(1-i*.24),0,TAU);ctx.fillStyle=i%2?"#fff6dc":"#c0301c";ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.stroke()}ctx.restore()}
  mgText("Kena: "+m.hits,150,70,40,"#ffd040");mgText("Sisa "+Math.max(0,Math.ceil(m.len-m.t))+"d",W-150,70,34);
  ctx.save();ctx.translate(m.cx,m.cy);ctx.strokeStyle=INK;ctx.lineWidth=6;ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.moveTo(-34,0);ctx.lineTo(34,0);ctx.moveTo(0,-34);ctx.lineTo(0,34);ctx.stroke();ctx.strokeStyle="#fff";ctx.lineWidth=2.5;ctx.stroke();ctx.restore();if(m.state==="intro")mgText("BERSIAP...",W/2,H/2,80)}
 for(const f of m.fx){ctx.globalAlpha=Math.max(0,1-f.t/.7);mgText(f.txt,f.x,f.y-f.t*70,34,f.c);ctx.globalAlpha=1}
 mgText(MGN[m.kind],W/2,50,40,"#ffd040")}

function howto(){ui(`<div class=card><h2>CARA BERMAIN</h2><div class=txt style="text-align:left"><b>Peta:</b> kamera mengikuti Wira; tekan <b>G</b> atau tombol Peta Global untuk melihat seluruh Nusantara. Berjalan bebas dengan WASD/←↑→↓ atau joystick. Dekati tempat/NPC lalu tekan <b>Enter/E</b> atau tombol aksi. Bicaralah dengan warga untuk misi &amp; minigame, cari koin tersembunyi, baca penanda <b style="color:#3a8ae0">ⓘ</b> untuk belajar budaya Nusantara, buka Perlengkapan untuk memilih senjata, jimat, dan Aji.<br><br><b>PC:</b> A/D atau ←→ gerak · ↓ jongkok · ↑ bidik atas · <b>Spasi/Z</b> lompat (tekan lagi di udara pada objek <span style="color:#e0508a">merah muda</span> = parry) · <b>X/J</b> tembak (tahan) · <b>Shift/C</b> dash (kebal sesaat) · <b>Ctrl</b> kunci bidik · <b>Tab/Q</b> ganti senjata · <b>V</b> Aji terpilih (butuh kartu, isi dengan parry) · P jeda · M bisu.<br><br><b>HP:</b> joystick dinamis — sentuh di mana saja di sisi kiri layar; tombol di kanan.<br><br><b>Koin:</b> kalahkan musuh di stage (+1/+2), ambil 5 <b>koin pusaka</b> tersembunyi (+10 tiap koin), dan menangkan boss. Belanjakan di <b>Warung Mbok Rondo</b>. Tiap pencapaian memberi koin; level naik dari EXP dan membuka Aji baru.</div><button class=bt onclick="AU.sfx('click');menu()">KEMBALI</button></div>`)}

function launch(n){G.node=n;if(n.t==="stage")startRun(n);else if(n.t==="mini")startFight(MINIS[n.idx],"mini");else startFight(BOSSES[n.idx],"boss")}
function toMap(){enterMap()}
function nodePanel(n){const i=nodeIdx(n.id),intro=(n.t==="stage"&&ISLAND_INTRO[n.id]&&!SAVE.seen[n.id])?`<div class=tip style="margin-bottom:8px">${ISLAND_INTRO[n.id]}</div>`:"",kind={stage:"STAGE RUN-AND-GUN",mini:"MINIBOSS",boss:"BOSS"}[n.t],txt=n.t==="boss"?ST_BOSS[n.idx]:n.t==="mini"?ST_MINI[n.idx]:n.s+"<br><br><span class=tip>Petunjuk: tembak musuh, hindari duri, dan capai gerbang di ujung. Benda <b style='color:#e0508a'>MERAH MUDA</b> bisa di-parry. Koin pusaka tersembunyi di atas platform.</span>",done=SAVE.done[n.id];
 const extra=n.t==="stage"?`<div class=sm>Koin pusaka: ${(SAVE.pc[n.id]||[]).filter(Boolean).length}/5</div>`:(done&&done!==1?`<div class=sm>Peringkat terbaik: ${done}</div>`:"");
 ui(`<div class=card><div class=sm>${kind}</div><h2>${n.n}</h2>${extra}${intro}<div class=txt>${txt}</div><button class=bt onclick="AU.sfx('click');SAVE.seen['${n.id}']=1;save();launch(NODES[${i}])">MASUK ▶</button><button class="bt alt" onclick="AU.sfx('click');closePanel()">KEMBALI</button></div>`)}
// ---------- toko ----------
function equipPanel(t){shop(t,true)}
function shop(tab,eq){tab=tab||"w";SHOPEQ=!!eq;const own=SAVE.w,tabs=[["w","SENJATA"],["c","JIMAT"],["u","UPGRADE"],["a","AJI"]];let rows="";
 if(tab==="w")rows=WEAP.map((w,i)=>{const o=own.includes(i);return`<div class=srow><div><b>${w.n}</b>${SAVE.eq[0]===i?" <i class=tg>UTAMA</i>":""}${SAVE.eq[1]===i?" <i class=tg>CADANGAN</i>":""}<small>${w.d}</small></div><div class=sbt>${o?`<button class=sb onclick="eqW(${i},0)">UTAMA</button><button class=sb onclick="eqW(${i},1)">CADANGAN</button>`:`<button class="sb buy" ${SAVE.coins<w.price?"disabled":""} onclick="buy('w',${i})">BELI ${w.price}</button>`}</div></div>`}).join("");
 else if(tab==="c")rows=`<div class=sm>Pasang maksimal 2 jimat (${SAVE.che.length}/2)</div>`+CHARM.map((c,i)=>{const o=SAVE.ch.includes(c.id),e=SAVE.che.includes(c.id);return`<div class=srow><div><b>${c.n}</b>${e?" <i class=tg>DIPASANG</i>":""}<small>${c.d}</small></div><div class=sbt>${o?`<button class=sb onclick="togCharm('${c.id}')">${e?"LEPAS":"PASANG"}</button>`:`<button class="sb buy" ${SAVE.coins<c.price?"disabled":""} onclick="buy('c',${i})">BELI ${c.price}</button>`}</div></div>`}).join("");
 else if(tab==="a"){const lv=levelOf(SAVE.exp),need=expFor(lv+1),cur=expFor(lv);rows=`<div class=sm>Level ${lv} · EXP ${SAVE.exp} (selanjutnya ${need})</div>`+AJI.map((a,i)=>{const ok=lv>=a.lv;return`<div class=srow style="${ok?"":"opacity:.55"}"><div><b>${a.n}</b> <i class=tg>${a.cost} kartu</i>${SAVE.aji===i?" <i class=tg>DIPILIH</i>":""}<small>${a.d}</small></div><div class=sbt>${ok?`<button class=sb onclick="pickAji(${i})">PILIH</button>`:`<i class=tg>Lv ${a.lv}</i>`}</div></div>`}).join("")}
 else rows=UPG.map((u,i)=>{const lv=SAVE.up[u.id],max=lv>=u.prices.length,pr=u.prices[lv];return`<div class=srow><div><b>${u.n}</b> <i class=tg>Lv ${lv}/${u.prices.length}</i><small>${u.d}</small></div><div class=sbt><button class="sb buy" ${max||SAVE.coins<pr?"disabled":""} onclick="buy('u',${i})">${max?"MAKS":"TINGKATKAN "+pr}</button></div></div>`}).join("");
 ui(`<div class="card shop"><div class=sm>${SHOPEQ?"Persiapan Wira":"Warung Mbok Rondo"}</div><h2>${SHOPEQ?"PERLENGKAPAN":"TOKO PUSAKA"}</h2><div class=coinbar>KOIN: <b>${SAVE.coins}</b></div><div class=tabs>${tabs.map(t=>`<button class="tab ${t[0]===tab?"on":""}" onclick="AU.sfx('click');shop('${t[0]}',SHOPEQ)">${t[1]}</button>`).join("")}</div><div class=srows>${rows}</div><button class="bt alt" onclick="AU.sfx('click');closePanel()">KELUAR</button></div>`)}
let SHOPEQ=false;function pickAji(i){SAVE.aji=i;save();AU.sfx("swap");shop("a",SHOPEQ)}
function buy(t,i){let pr,ok=false;if(t==="w"){pr=WEAP[i].price;if(SAVE.coins>=pr&&!SAVE.w.includes(i)){SAVE.w.push(i);ok=true}}else if(t==="c"){pr=CHARM[i].price;if(SAVE.coins>=pr&&!SAVE.ch.includes(CHARM[i].id)){SAVE.ch.push(CHARM[i].id);ok=true}}else{const u=UPG[i],lv=SAVE.up[u.id];pr=u.prices[lv];if(pr!==undefined&&SAVE.coins>=pr){SAVE.up[u.id]++;ok=true}}
 if(ok){SAVE.coins-=pr;SAVE.stats.spent+=pr;SAVE.stats.buys++;save();AU.sfx("buy");checkAch()}else AU.sfx("nope");shop(t,SHOPEQ)}
function eqW(i,s){if(SAVE.eq[1-s]===i){SAVE.eq[1-s]=SAVE.eq[s]}SAVE.eq[s]=i;save();AU.sfx("swap");shop("w",SHOPEQ)}
function togCharm(id){const k=SAVE.che.indexOf(id);if(k>=0)SAVE.che.splice(k,1);else if(SAVE.che.length<2)SAVE.che.push(id);else{AU.sfx("nope");shop("c",SHOPEQ);return}save();AU.sfx("swap");shop("c",SHOPEQ)}
// ---------- hasil ----------
function grade(){const t=G.time,h=G.hits,p=G.parries;const sc=100-h*18-Math.max(0,t-100)*.35+p*4;return sc>=88?"S":sc>=70?"A":sc>=50?"B":"C"}
function winScreen(){const n=G.node,g=grade(),first=!SAVE.done[n.id],order="CBAS",base=G.kind==="boss"?40:20;let reward=first?base+{S:30,A:20,B:10,C:0}[g]:10;
 if(first||order.indexOf(g)>order.indexOf(SAVE.done[n.id]))SAVE.done[n.id]=g;reward=Math.round(reward*DIFF[SAVE.diff].rw*(SAVE.che.includes("sirih")?1.25:1));addCoins(reward);addExp(first?150:40);SAVE.stats.bosses+=G.kind==="boss"?1:0;SAVE.stats.minis+=G.kind==="mini"?1:0;if(G.hits===0)SAVE.stats.perfect++;if(SAVE.diff===2&&G.kind==="boss")SAVE.stats.hardBoss++;if(g==="S")SAVE.stats.sRank++;SAVE.node=n.id;save();checkAch();AU.sfx("win");$("touch").style.display="none";
 const last=n.id==="b4"&&first;ui(`<div class=card><div class=sm>${G.def.name} TUMBANG!</div><h2>HASIL</h2><div class=grade>${g}</div><div class=txt>Waktu: ${Math.floor(G.time/60)}m ${Math.floor(G.time%60)}d<br>Terkena: ${G.hits}× &nbsp; Parry: ${G.parries}×<br><b>Hadiah: +${reward} koin</b>${first?"":" <small>(ulang)</small>"}</div>${first&&G.kind==="boss"&&BOSS_EPI[n.idx]!=="—"?`<div class=tip style="margin:6px 0">${BOSS_EPI[n.idx]}</div>`:""}${last?`<button class=bt onclick="AU.sfx('click');ending()">LANJUT ▶</button>`:`<button class=bt onclick="AU.sfx('click');toMap()">KE PETA ▶</button>`}<button class="bt alt" onclick="AU.sfx('click');launch(G.node)">ULANGI</button><button class="bt alt" onclick="AU.sfx('click');menu()">MENU</button></div>`)}
function stageWin(){const n=G.node,id=n.id;SAVE.pc[id]=SAVE.pc[id]||[false,false,false,false,false];for(const c of G.bc)if(c.taken)SAVE.pc[id][c.i]=true;const first=!SAVE.done[id],pus=G.pcGot*10,earn=Math.round((G.rc+pus+(first?15:0))*DIFF[SAVE.diff].rw*(SAVE.che.includes("sirih")?1.25:1));SAVE.done[id]=1;SAVE.stats.stages++;SAVE.stats.pusaka+=G.pcGot;addCoins(earn);addExp(first?60:20);SAVE.node=id;save();checkAch();AU.sfx("win");$("touch").style.display="none";
 ui(`<div class=card><div class=sm>${RUNTH[G.th].name}</div><h2>STAGE SELESAI</h2><div class=txt>Musuh dikalahkan: <b>+${G.rc}</b> koin<br>Koin pusaka baru: ${G.pcGot} <b>(+${pus})</b><br>${first?"Bonus pertama kali: <b>+15</b><br>":""}Pusaka terkumpul: ${SAVE.pc[id].filter(Boolean).length}/5<br><br><b>Total: +${earn} koin</b></div><button class=bt onclick="AU.sfx('click');toMap()">KE PETA ▶</button><button class="bt alt" onclick="AU.sfx('click');launch(G.node)">ULANGI STAGE</button></div>`)}
function runDeadScreen(){$("touch").style.display="none";ui(`<div class=card><h2 style="color:#a01010">WIRA GUGUR</h2><div class=txt>Stage belum selesai. Koin yang dikumpulkan di percobaan ini hangus.<br>Tarik napas dan coba lagi.</div><button class=bt onclick="AU.sfx('click');launch(G.node)">ULANGI STAGE</button><button class="bt alt" onclick="AU.sfx('click');toMap()">KE PETA</button></div>`)}
function deadScreen(){$("touch").style.display="none";ui(`<div class=card><h2 style="color:#a01010">WIRA GUGUR</h2><div class=txt>${G.def.name} masih berdiri.<br>Pelajari polanya, perkuat dirimu di toko, lalu coba lagi.</div><button class=bt onclick="AU.sfx('click');launch(G.node)">COBA LAGI</button><button class="bt alt" onclick="AU.sfx('click');toMap()">KE PETA</button></div>`)}
function ending(){ui(`<div class=card><h2>${ENDING.t}</h2><div class=txt>${ENDING.p}</div><button class=bt onclick="AU.sfx('click');toMap()">KE PETA</button></div>`)}
// ---------- touch ----------
{const map={bJump:"jump",bShoot:"shoot",bDash:"dash",bSup:"sup",bSwap:"swap"};for(const id in map){const b=$(id);const k=map[id];const on=e=>{e.preventDefault();TCH[k]=1;b.classList.add("on")},off=e=>{e.preventDefault();TCH[k]=0;b.classList.remove("on")};b.addEventListener("touchstart",on,{passive:false});b.addEventListener("touchend",off,{passive:false});b.addEventListener("touchcancel",off,{passive:false})}
 const joy=$("joy"),kn=$("knob"),zone=$("jzone");let jid=null,jc=[0,0];const R=65,home=()=>{joy.style.left="22px";joy.style.bottom="22px";joy.style.top="auto"};
 const setJ=t=>{let dx=t.clientX-jc[0],dy=t.clientY-jc[1];const m=R*.7,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}kn.style.transform=`translate(${dx}px,${dy}px)`;TCH.l=dx<-m*.3?1:0;TCH.r=dx>m*.3?1:0;TCH.u=dy<-m*.45?1:0;TCH.d=dy>m*.45?1:0};
 zone.addEventListener("touchstart",e=>{e.preventDefault();if(jid!==null)return;const t=e.changedTouches[0];jid=t.identifier;const x=Math.max(R+6,Math.min(innerWidth*.55-R,t.clientX)),y=Math.max(R+6,Math.min(innerHeight-R-6,t.clientY));jc=[x,y];joy.style.left=(x-R)+"px";joy.style.top=(y-R)+"px";joy.style.bottom="auto";joy.classList.add("act");setJ(t)},{passive:false});
 addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===jid){e.preventDefault();setJ(t)}},{passive:false});
 const je=e=>{for(const t of e.changedTouches)if(t.identifier===jid){jid=null;TCH.l=TCH.r=TCH.u=TCH.d=0;kn.style.transform="";joy.classList.remove("act");home()}};addEventListener("touchend",je);addEventListener("touchcancel",je)}
// ---------- boot ----------
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.033,(now-(frame.l||now))/1000);frame.l=now;update(dt);draw();AU.tick()}
buildBG(0);buildMap();buildMask();menu();requestAnimationFrame(frame);window.__G=G;
</script></body></html>

function CYL(cx,cy,cz,r,w,side,cap,n){n=n||10;const v=[],f=[];for(let s=0;s<2;s++)for(let i=0;i<n;i++){const a=i/n*Math.PI*2;v.push([cx+(s?w/2:-w/2),cy+r*Math.sin(a),cz+r*Math.cos(a)])}
 for(let i=0;i<n;i++)f.push([[i,(i+1)%n,n+(i+1)%n,n+i],side]);f.push([Array.from({length:n},(_,i)=>i),cap]);f.push([Array.from({length:n},(_,i)=>n+i),cap]);return{v,f}}

 for(const part of mesh.parts){const tv=part.v.map(p=>{const rx=p[0]*cr-p[1]*sr,ry=p[0]*sr+p[1]*cr,wx=rx*cy+p[2]*sy,wz=-rx*sy+p[2]*cy;return[o.x+wx,o.y+ry+wz*slope,o.z+wz]});
